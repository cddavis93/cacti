# ===========================================================================
# CACTI configuration: NVIDIA A100 L2 cache slice + NCC unit
# ===========================================================================
# The A100 has 80 L2 cache slices (10 memory controllers x 8 slices each).
# This config models ONE slice (512 KB) paired with one NCC unit (32 FP32 FMAs).
# Multiply cache area/power results by 80 for full-GPU L2 totals.
# The NCC block already reports 80-unit totals.
#
# Technology note: A100 is fabricated on Samsung 8nm (nominally "7nm").
# CACTI's finest device-parameter file is 16nm, but the 16nm analytical
# models (wire repeater sizing, folded-transistor geometry) produce
# degenerate values that crash CACTI — this was why the 16->22nm
# interpolation range was commented out upstream.  22nm is therefore
# used as the technology floor for all CACTI-derived cache estimates.
#
# The NCC FP32 model is unaffected: ncc.cc uses its own 7nm calibration
# anchor with F^2 area scaling and pulls Vdd/C_g/I_off from g_tp at
# whatever node is selected here, making NCC estimates technology-aware.
# ===========================================================================

# --- Cache size ---
# A100 L2: 40 MB total / 80 slices = 512 KB per slice = 524,288 bytes
-size (bytes) 524288

# --- Power gating ---
-Array Power Gating - "false"
-WL Power Gating - "false"
-CL Power Gating - "false"
-Bitline floating - "false"
-Interconnect Power Gating - "false"
-Power Gating Performance Loss 0.01

# --- Cache line (block) size ---
# A100 GPU cache line = 128 bytes (matches 128-byte warp memory transaction).
-block size (bytes) 128

# --- Associativity ---
# NVIDIA Ampere L2 is 16-way set-associative.
-associativity 16

# --- Ports ---
# One read-write port per slice.
-read-write port 1
-exclusive read port 0
-exclusive write port 0
-single ended read ports 0

# --- Banks ---
-UCA bank count 1

# --- Technology node ---
# 22nm: CACTI's finest analytically validated node.
# A100 actual process is Samsung 8nm; cache timing/power/area estimates
# are conservative (larger/slower than real 8nm silicon).
-technology (u) 0.022

# --- DRAM main-memory parameters (not applicable to L2 cache modeling) ---
-page size (bits) 8192
-burst length 8
-internal prefetch width 8

# --- Cell and peripheral technology flavor ---
# itrs-hp (high-performance): best match for a GPU L2 optimized for
# bandwidth, consistent with A100's 400 W TDP design point.
-Data array cell type - "itrs-hp"
-Data array peripheral type - "itrs-hp"
-Tag array cell type - "itrs-hp"
-Tag array peripheral type - "itrs-hp"

# --- Output bus width ---
# A100 L2 delivers one 128-byte cache line per access = 1024 bits.
-output/input bus width 1024

# --- Operating temperature ---
# A100 junction temperature under sustained GPU compute: ~87 degC = 360 K.
# (CACTI requires a multiple of 10 in [300, 400].)
-operating temperature (K) 360

# --- Cache type ---
-cache type "cache"

# --- Tag size ---
-tag size (b) "default"

# --- Access mode ---
# Normal: tag and data arrays accessed in parallel; data broadcast after tag hit.
-access mode (normal, sequential, fast) - "normal"

# --- Design objective ---
# Optimize for cycle time (throughput); A100's priority is sustained bandwidth.
-design objective (weight delay, dynamic power, leakage power, cycle time, area) 0:0:0:100:0
-deviate (delay, dynamic power, leakage power, cycle time, area) 20:100000:100000:100000:100000

# --- NUCA objectives (unused; UCA model selected below) ---
-NUCAdesign objective (weight delay, dynamic power, leakage power, cycle time, area) 100:100:0:0:100
-NUCAdeviate (delay, dynamic power, leakage power, cycle time, area) 10:10000:10000:10000:10000

-Optimize ED or ED^2 (ED, ED^2, NONE): "ED^2"

# --- Cache model ---
# Each 512 KB slice is modeled as a single UCA array.
-Cache model (NUCA, UCA)  - "UCA"
-NUCA bank count 0

# --- Wire signaling ---
# Semi-global wires with 30% delay overhead for realistic on-chip cache interconnect.
-Wire signaling (fullswing, lowswing, default) - "Global_30"
-Wire inside mat - "semi-global"
-Wire outside mat - "semi-global"
-Interconnect projection - "conservative"

# --- Core count / cache level ---
# A100 has 108 SMs; CACTI supports 4/8/16 — use 16 as the closest.
-Core count 16
-Cache level (L2/L3) - "L2"

# --- ECC ---
# A100 L2 supports SECDED ECC on all cache arrays.
-Add ECC - "true"

-Print level (DETAILED, CONCISE) - "DETAILED"
-Print input parameters - "false"

-Force cache config - "false"
-Ndwl 1
-Ndbl 1
-Nspd 0
-Ndcm 1
-Ndsam1 0
-Ndsam2 0


#### External IO / MemCAD parameters
# A100 uses HBM2e; CACTI has no HBM model.  These DDR3 defaults are
# retained for tool completeness — their output should be disregarded.

-dram_type "DDR3"
-io state "WRITE"
-addr_timing 1.0
-mem_density 4 Gb
-bus_freq 800 MHz
-duty_cycle 1.0
-activity_dq 1.0
-activity_ca 0.5
-num_dq 72
-num_dqs 18
-num_ca 25
-num_clk  2
-num_mem_dq 2
-mem_data_width 8
-rtt_value 10000
-ron_value 34
-tflight_value
-num_bobs 1
-capacity 80
-num_channels_per_bob 1
-first metric "Cost"
-second metric "Bandwidth"
-third metric "Energy"
-DIMM model "ALL"
-mirror_in_bob "F"


#### NCC (Near-Cache Compute) Unit Parameters
# One NCC unit per L2 slice: 32 FP32 FMAs (one per warp thread).
# A100: 80 slices x 32 FMAs = 2,560 total NCC FP32 units.
# Clock matches L2 domain (1,410 MHz on A100).
# Activity factor = measured FU utilization for ncc_fmul/ncc_fadd.
-ncc_enable "true"
-ncc_num_units 80
-ncc_fus_per_unit 32
-ncc_clock_mhz 1410
-ncc_activity_factor 1.0
-ncc_gate_count 5500
-ncc_routing_factor 1.25
