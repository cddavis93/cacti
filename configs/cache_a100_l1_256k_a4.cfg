# ===========================================================================
# CACTI configuration: NVIDIA A100 L1 data cache (one SM)
# ===========================================================================
# A100 has 108 SMs, each with a 192 KB combined L1/shared memory.
# (2026-10-08) Accel-Sim's adaptive config gives the L1 192 KB minus the per-kernel
# shared-memory carveout; 77.6% of the warm-resim targets ran with the full 192 KB.
# CACTI needs power-of-two capacities, so 192 KB is the mean of the 128 KB and 256 KB
# runs (compute_power.py L1_VARIANT). This file: see -size / -associativity / -access mode.
# Multiply area/power results by 108 for full-GPU L1 totals.
#
# Technology: 22nm (smallest CACTI 7 node; A100 is TSMC N7).
# ===========================================================================

# --- Cache size ---
-size (bytes) 262144

# --- Power gating ---
-Array Power Gating - "false"
-WL Power Gating - "false"
-CL Power Gating - "false"
-Bitline floating - "false"
-Interconnect Power Gating - "false"
-Power Gating Performance Loss 0.01

# --- Cache line size ---
# A100 L1 cache line = 128 bytes
-block size (bytes) 128

# --- Associativity ---
# Ampere L1 is 4-way set-associative
-associativity 4

# --- Ports ---
-read-write port 1
-exclusive read port 0
-exclusive write port 0
-single ended read ports 0

# --- Banks ---
-UCA bank count 1

# --- Technology ---
-technology (u) 0.022

# --- DRAM parameters (unused for L1) ---
-page size (bits) 8192
-burst length 8
-internal prefetch width 8

# --- Cell and peripheral technology flavor ---
-Data array cell type - "itrs-hp"
-Data array peripheral type - "itrs-hp"
-Tag array cell type - "itrs-hp"
-Tag array peripheral type - "itrs-hp"

# --- Output bus width ---
# 128-byte cache line = 1024 bits
-output/input bus width 1024

# --- Operating temperature ---
-operating temperature (K) 360

# --- Cache type ---
-cache type "cache"

# --- Tag size ---
-tag size (b) "default"

# --- Access mode ---
-access mode (normal, sequential, fast) - "normal"

# --- Design objective ---
# Optimize for access time for L1 (latency-sensitive)
-design objective (weight delay, dynamic power, leakage power, cycle time, area) 100:0:0:0:0
-deviate (delay, dynamic power, leakage power, cycle time, area) 20:100000:100000:100000:100000

# --- NUCA objectives (unused) ---
-NUCAdesign objective (weight delay, dynamic power, leakage power, cycle time, area) 100:100:0:0:100
-NUCAdeviate (delay, dynamic power, leakage power, cycle time, area) 10:10000:10000:10000:10000

-Optimize ED or ED^2 (ED, ED^2, NONE): "ED^2"

# --- Cache model ---
-Cache model (NUCA, UCA)  - "UCA"
-NUCA bank count 0

# --- Wire signaling ---
-Wire signaling (fullswing, lowswing, default) - "Global_30"
-Wire inside mat - "semi-global"
-Wire outside mat - "semi-global"
-Interconnect projection - "conservative"

# --- Core count / cache level ---
-Core count 16
-Cache level (L2/L3) - "L2"

# --- ECC ---
-Add ECC - "true"

-Print level (DETAILED, CONCISE) - "DETAILED"
-Print input parameters - "false"

-Force cache config - "false"
-Ndwl 1
-Ndbl 1
-Nspd 0
-Ndcm 1
-Ndsam1 0
-Ndsam2 0

#### External IO / MemCAD (unused for L1)
-dram_type "DDR3"
-io state "WRITE"
-addr_timing 1.0
-mem_density 4 Gb
-bus_freq 800 MHz
-duty_cycle 1.0
-activity_dq 1.0
-activity_ca 0.5
-num_dq 72
-num_dqs 18
-num_ca 25
-num_clk  2
-num_mem_dq 2
-mem_data_width 8
-rtt_value 10000
-ron_value 34
-tflight_value
-num_bobs 1
-capacity 80
-num_channels_per_bob 1
-first metric "Cost"
-second metric "Bandwidth"
-third metric "Energy"
-DIMM model "ALL"
-mirror_in_bob "F"

#### NCC disabled for L1 config
-ncc_enable "false"
-ncc_num_units 80
-ncc_fus_per_unit 32
-ncc_clock_mhz 1410
-ncc_activity_factor 0.054
